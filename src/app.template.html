:root{--bg:#0d0d0e;--panel:#18181a;--panel2:#202023;--line:#2c2c30;--grey:#8c8c8c;--ink:#f3f3f3;--red:#e30d0f;--red2:#ff2b2d;--aside:#111113;--dash:#44444a;--dis:#3a3a3e;--mute:#5a5a60;--overbg:#2a0b0c;--foot:#000;--tipbg:#000;--c-grid:#2c2c30;--c-lab:#8c8c8c;--c-bar:#5a5a60;--fig:#222226;--h0:#303035;--h1:#6e1416;--h2:#b70d10;--h3:#ff2b2d;--hm1:#b30a0c;--onink:#000;--hot:rgba(227,13,15,.12);color-scheme:dark}

.top{--ink:#f3f3f3;--line:#3a3a3e;--grey:#9a9a9a;--panel2:#202023;--onink:#000;color:var(--ink)}

.foot{position:fixed;left:0;right:0;bottom:0;background:var(--foot);border-top:1px solid var(--line);padding:12px max(3vw,16px) calc(12px + env(safe-area-inset-bottom));display:flex;gap:14px;align-items:center;flex-wrap:wrap;z-index:6}

.nav button.on{background:var(--red);color:#fff}
.ghost.hot{border-color:var(--red);color:var(--ink);background:var(--hot)}

<script>/*FITSDK*/</script>
<script>
{
const CD = __CATALOG__;
const MUS = CD.muscles, EQG = CD.eq, GL = CD.gloss;
const norm = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const CAT = CD.ex.map(([c, e, en, it, ci, p, s, q]) => ({ c, e, en, it, n: it || en, cat: CD.cats[ci], p, s, q, k: norm(`${it} ${en} ${CD.cats[ci].it} ${CD.cats[ci].en}`) }));
const BYID = new Map(CAT.map(x => [x.c + ":" + x.e, x]));
const byId = (c, e) => c === null || c === undefined ? null : BYID.get(c + ":" + e) || null;
const bitsOf = m => MUS.map((_, i) => i).filter(i => m & (1 << i));
const B = i => 1 << i;
// muscoli: 0 petto 1 spalle 2 bicipiti 3 tricipiti 4 avambracci 5 addominali 6 obliqui 7 dorsali 8 trapezi 9 lombari 10 glutei 11 quadricipiti 12 femorali 13 adduttori 14 abduttori 15 polpacci 16 flessori anca
const GROUPS = [["Tutti", 0], ["Le mie", -1], ["Stretching e mobilità", -2], ["Petto", B(0)], ["Schiena", B(7) | B(8) | B(9)], ["Spalle", B(1)], ["Braccia", B(2) | B(3) | B(4)], ["Gambe", B(11) | B(12) | B(13) | B(14) | B(15) | B(16)], ["Glutei", B(10)], ["Core", B(5) | B(6)]];
// muscoli di un esercizio della scheda: [primari, secondari] come maschere
const musOf = x => { const c = byId(x.c, x.e); return c ? [c.p, c.s] : [x.pm || 0, 0]; };
const ST = CD.stretch, STBY = new Map(ST.map(z => [z.c + ":" + z.e, z])), PRE = CD.presets;
const stOf = x => x && x.c !== null && x.c !== undefined ? STBY.get(x.c + ":" + x.e) : null;
const anim = (st, cls = "") => st ? `<div class="anim ${cls}"><img src="img/s/${st.img}-0.jpg" alt="" loading="lazy" onerror="this.parentNode.classList.add('none')"><img src="img/s/${st.img}-1.jpg" alt="" loading="lazy"></div>` : `<div class="anim none ${cls}"></div>`;
const mkStretch = (z, sec = 30) => { const c = byId(z.c, z.e); return { id: Math.random().toString(36).slice(2, 9), n: c ? c.n : z.k, c: z.c, e: z.e, sec, side: !!z.side }; };
const stSec = L => (L || []).reduce((a, x) => a + x.sec * (x.side ? 2 : 1), 0);
function suggestStretch(w, key) {
  const wt = MUS.map(() => 0);
  w.ex.forEach(x => { const [p, q] = musOf(x); bitsOf(p).forEach(i => wt[i] += 1); bitsOf(q).forEach(i => wt[i] += 0.5); });
  if (!wt.some(v => v > 0)) { const pr = PRE.find(z => z[0] === key); return pr[2].map(k => mkStretch(ST.find(z => z.k === k))); }
  const pool = ST.filter(z => key === "warm" ? z.dyn : !z.dyn), n = key === "warm" ? 5 : 6, pick = [];
  while (pick.length < n) {
    let best = null, bs = -1;
    for (const z of pool) { if (pick.includes(z)) continue; const sc = bitsOf(z.m).reduce((a, i) => a + wt[i], 0) / Math.sqrt(bitsOf(z.m).length) + 0.001; if (sc > bs) { bs = sc; best = z; } }
    if (!best) break; pick.push(best); bitsOf(best.m).forEach(i => wt[i] *= 0.3);
  }
  return pick.map(z => mkStretch(z));
}
const KEY = "ant-schede-v1";
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const I = {
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>', down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  dup: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  del: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>',
  dl: '<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  snd: '<path d="M4 10v4h4l5 4V6L8 10H4zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>', mute: '<path d="M4 10v4h4l5 4V6L8 10H4zM17 10l4 4M21 10l-4 4"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const findIt = n => CAT.find(x => x.it === n);
const mk = (n, mode, sets, v, kg, rest) => { const c = findIt(n); return { id: uid(), n, c: c ? c.c : null, e: c ? c.e : null, mode, same: true, sets: Array.from({length: sets}, () => ({v, kg})), rest, restAfter: 120 }; };

function sample() {
  return [{ id: uid(), name: "Full body A", desc: "Scheda di esempio: modificala o creane una nuova", ex: [
    mk("Squat con bilanciere", "reps", 4, 8, 80, 120), mk("Panca piana con bilanciere", "reps", 4, 8, 60, 120),
    mk("Rematore con bilanciere", "reps", 3, 10, 50, 90), mk("Lento con manubri seduto", "reps", 3, 10, 16, 90),
    mk("Plank", "time", 3, 45, 0, 60)] }];
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !Array.isArray(S.w) || !S.w.length) S = { w: sample(), cur: null, view: "welcome" };
if (!S.w.some(w => w.id === S.cur)) S.cur = S.w[0].id;
if (!Array.isArray(S.log)) S.log = [];
const CFG0 = { theme: "dark", vol: 0.7, vib: true, cd: true, wake: true, rest: 90, restAfter: 120, incUp: 2.5, incLow: 5 };
S.cfg = Object.assign({}, CFG0, S.cfg || {});
S.w.forEach(w => w.ex.forEach(x => { if (x.restAfter === undefined) x.restAfter = x.rest; }));
if (S.view === "guida") S.view = "imp";
if (S.live && !S.live.q) { S.live.q = planSteps(S.live.ex); S.live.k = Math.max(0, S.live.q.findIndex(([i, j]) => i === S.live.i && j === S.live.j)); }
if (!["schede", "diario", "log", "imp", "welcome", "live"].includes(S.view) || (S.view === "log" && !S.draft) || (S.view === "live" && !S.live)) S.view = "schede";
// tema
const mqDark = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
function applyTheme() {
  const t = S.cfg.theme, dark = t === "dark" || (t === "auto" && (!mqDark || mqDark.matches));
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  try { localStorage.setItem("ant-theme", t); } catch (e) {}
}
applyTheme();
if (mqDark && mqDark.addEventListener) mqDark.addEventListener("change", () => { if (S.cfg.theme === "auto") { applyTheme(); render(); } });
// gruppi di superserie: esercizi consecutivi collegati
function groupsOf(ex) { const g = []; let cur = []; ex.forEach((x, i) => { cur.push(i); if (!x.link || i === ex.length - 1) { g.push(cur); cur = []; } }); return g; }
const groupOf = (ex, i) => groupsOf(ex).find(g => g.includes(i));
function syncGroup(ex, i) {
  const g = groupOf(ex, i), n = ex[i].sets.length;
  g.forEach(k => { const z = ex[k]; while (z.sets.length < n) z.sets.push({ ...z.sets[z.sets.length - 1] }); z.sets.length = n; });
}
// sequenza dei passi di allenamento: [esercizio, serie, pausa dopo in secondi]
function planSteps(ex) {
  const q = [];
  for (const g of groupsOf(ex)) {
    if (g.length === 1) { const i = g[0], x = ex[i]; x.sets.forEach((s, j) => q.push([i, j, j < x.sets.length - 1 ? x.rest : (x.restAfter ?? x.rest)])); continue; }
    const R = Math.max(...g.map(i => ex[i].sets.length)), L = ex[g[g.length - 1]];
    for (let r = 0; r < R; r++) g.forEach((i, m) => { if (r >= ex[i].sets.length) return; const last = m === g.length - 1; q.push([i, r, last ? (r < R - 1 ? L.rest : (L.restAfter ?? L.rest)) : (ex[i].restAfter || 0)]); });
  }
  if (q.length) q[q.length - 1][2] = 0;
  return q;
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const W = () => S.w.find(w => w.id === S.cur);

// ---- calcoli ----
const secPerRep = 3;
function stats(w) {
  let sets = 0, sec = 0, vol = 0;
  for (const [i, j, r] of planSteps(w.ex)) {
    const x = w.ex[i], s = x.sets[j];
    sets++; sec += (x.mode === "reps" ? s.v * secPerRep : s.v) + r;
    if (x.mode === "reps") vol += s.v * (s.kg || 0);
  }
  for (const L of [w.warm, w.cool]) (L || []).forEach(x => sec += x.sec * (x.side ? 2 : 1) + 5);
  return { n: w.ex.length, sets, min: Math.round(sec / 60), vol: Math.round(vol) };
}
const fmtN = n => n.toLocaleString("it-IT");

// ---- render ----
function renderList() {
  $("wks").innerHTML = S.w.map(w => { const s = stats(w); return `<button class="wk${w.id === S.cur ? " on" : ""}" data-w="${w.id}"><b>${esc(w.name || "Senza nome")}</b><span>${s.n} esercizi · ${s.sets} serie · ≈ ${s.min} min</span></button>`; }).join("")
    + `<button class="wk plus" id="nw" aria-label="Nuova scheda" title="Nuova scheda">+</button>`;
}
function renderStats() {
  const w = W(), s = stats(w);
  $("st").innerHTML = `<div><b>${s.n}</b><span>esercizi</span></div><div><b>${s.sets}</b><span>serie totali</span></div><div><b>≈ ${s.min} min</b><span>durata stimata</span></div><div><b>${fmtN(s.vol)} kg</b><span>volume</span></div>`;
  $("fs").innerHTML = w.ex.length ? `<b>${esc(w.name || "Senza nome")}</b> · ${s.n} esercizi, ${s.sets} serie` : "Aggiungi almeno un esercizio per esportare";
  $("lv").disabled = $("lg").disabled = !w.ex.length;
  $("lvt0").textContent = S.live ? "Riprendi allenamento" : "Allenati ora";
  renderList();
}

      wipeArm = false; snap(); S.w = sample(); S.cur = S.w[0].id; S.log = []; S.live = null; S.draft = null; toast("Tutti i dati cancellati", true);
    }
    return commit();
  }
  if (S.view === "diario") {
    if (a === "pex") { S.pex = b.dataset.n; save(); document.querySelectorAll("#pex button").forEach(z => z.classList.toggle("on", z === b)); ros.forEach(r => r.disconnect()); ros = []; drawProgress(sorted()); drawVolume(sorted()); return; }
    if (a === "sdel") { e.preventDefault(); snap(); const ss = S.log.find(z => z.id === b.dataset.s); S.log = S.log.filter(z => z !== ss); toast(`Allenamento del ${fd(ss.date)} eliminato`, true); }
    if (a === "goschede") S.view = "schede";
    if (a === "mr") { S.mrange = b.dataset.v; }
    return commit();
  }
  if (a === "logw") return startLog();
  if (a === "exp") return exportFit();
  if (a === "livew") { if (S.live) { S.view = "live"; return commit(); } return startLive(); }
  const w = W(), i = +b.dataset.i, x = w.ex[i];
  if (a === "add") return openPick(-1);
  if (["ssm", "ssp", "sside", "sdl", "ssug", "spre", "sadd"].includes(a)) {
    const key = b.dataset.s, L = w[key] = w[key] || [], k = +b.dataset.k;
    if (a === "ssm") L[k].sec = Math.max(5, L[k].sec - 5);
    if (a === "ssp") L[k].sec = Math.min(600, L[k].sec + 5);
    if (a === "sside") L[k].side = !L[k].side;
    if (a === "sdl") { snap(); const n = L[k].n; L.splice(k, 1); toast(`«${n}» tolto`, true); }
    if (a === "ssug") { if (L.length) snap(); w[key] = suggestStretch(w, key); toast(key === "warm" ? "Riscaldamento proposto in base agli esercizi" : "Stretching proposto in base agli esercizi", L.length > 0); }
    if (a === "spre") return openPresets(key);
    if (a === "sadd") return openPick(-1, key);
    return commit();
  }
  if (a === "pick") return openPick(i);
  if (a === "up" || a === "down") { const j = a === "up" ? i - 1 : i + 1; [w.ex[i], w.ex[j]] = [w.ex[j], w.ex[i]]; [i, j, Math.min(i, j) - 1].forEach(k => { if (w.ex[k]) w.ex[k].link = false; }); }
  if (a === "dup") w.ex.splice(i + 1, 0, { ...JSON.parse(JSON.stringify(x)), id: uid() });
  if (a === "del") { snap(); if (!x.link && w.ex[i - 1]) w.ex[i - 1].link = false; w.ex.splice(i, 1); toast(`«${x.n}» eliminato`, true); }
  if (a === "link") { x.link = !x.link; if (x.link) { const g = groupOf(w.ex, i); syncGroup(w.ex, g[0]); } }
  if (a === "restAfter") x.restAfter = +b.dataset.v;
  if (a === "mode" && x.mode !== b.dataset.v) { x.mode = b.dataset.v; x.sets.forEach(s => s.v = x.mode === "reps" ? 10 : 30); }
  if (a === "sm" && x.sets.length > 1) { x.sets.pop(); syncGroup(w.ex, i); }
  if (a === "sp" && x.sets.length < 20) { x.sets.push({ ...x.sets[x.sets.length - 1] }); syncGroup(w.ex, i); }
  if (a === "rest") x.rest = +b.dataset.v;
  if (a === "pm") x.pm = (x.pm || 0) ^ B(+b.dataset.m);
  if (a === "same") { x.same = !b.checked; if (x.same) x.sets.forEach(s => Object.assign(s, x.sets[0])); }
  if (a === "dupw") { const c = JSON.parse(JSON.stringify(w)); c.id = uid(); c.name = (w.name || "Scheda") + " (copia)"; c.ex.forEach(z => z.id = uid()); S.w.push(c); S.cur = c.id; }
  if (a === "delw") {
    snap(); const n = w.name; S.w = S.w.filter(z => z !== w);
    if (!S.w.length) S.w.push({ id: uid(), name: "Nuova scheda", desc: "", ex: [] });
    S.cur = S.w[0].id; toast(`Scheda «${n || "Senza nome"}» eliminata`, true);
  }
  commit();
});
$("nav").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (!b) return; if ((S.view === "log" || S.view === "live") && b.dataset.v === "schede") return; S.view = b.dataset.v; commit(); window.scrollTo({ top: 0 }); });
// elenco schede: tocco = apri, pressione lunga (o tasto destro) = menu sposta/duplica/elimina
let lpT = null, lpFired = false, lpXY = null;
function newSheet() { S.view = "schede"; const w = { id: uid(), name: "Nuova scheda", desc: "", ex: [] }; S.w.push(w); S.cur = w.id; commit(); $("nm").select(); }
$("wks").addEventListener("pointerdown", e => {
  const b = e.target.closest("[data-w]"); if (!b) return;
  lpFired = false; lpXY = [e.clientX, e.clientY]; clearTimeout(lpT);
  lpT = setTimeout(() => { lpFired = true; try { navigator.vibrate && navigator.vibrate(30); } catch (er) {} openWkMenu(b.dataset.w); }, 550);
});
$("wks").addEventListener("pointermove", e => { if (lpT && lpXY && Math.hypot(e.clientX - lpXY[0], e.clientY - lpXY[1]) > 10) { clearTimeout(lpT); lpT = null; } });
["pointerup", "pointercancel", "pointerleave"].forEach(ev => $("wks").addEventListener(ev, () => { clearTimeout(lpT); lpT = null; }));
$("wks").addEventListener("contextmenu", e => { const b = e.target.closest("[data-w]"); if (!b) return; e.preventDefault(); clearTimeout(lpT); lpFired = true; openWkMenu(b.dataset.w); });
$("wks").addEventListener("click", e => {
  if (e.target.closest("#nw")) return newSheet();

  if (lpFired) { lpFired = false; return; }

});
$("psh").addEventListener("click", e => {
  if (e.target.id === "psh") return $("psh").classList.remove("open");
  const b = e.target.closest("[data-p]"); if (!b) return;
  $("psh").classList.remove("open"); if (b.dataset.p === "x") return;
  const z = PRE[+b.dataset.p], w = W(), had = (w[psk] || []).length; if (had) snap();
  w[psk] = z[2].map(k => mkStretch(ST.find(q => q.k === k))); commit(); toast(`Routine «${z[1]}» inserita`, had > 0);
});
let wkm = null;
function openWkMenu(id) { wkm = id; drawWkMenu(); $("wkm").classList.add("open"); }
function closeWkMenu() { wkm = null; $("wkm").classList.remove("open"); }
function drawWkMenu() {

    <div class="wkmg"><button class="ghost" data-m="prev" ${k ? "" : "disabled"}>${svg("up")}Sposta prima</button><button class="ghost" data-m="next" ${k < S.w.length - 1 ? "" : "disabled"}>${svg("down")}Sposta dopo</button>
    <button class="ghost" data-m="dup">${svg("dup")}Duplica</button><button class="ghost danger" data-m="del">${svg("del")}Elimina</button></div>

}
$("wkm").addEventListener("click", e => {
  if (e.target.id === "wkm") return closeWkMenu();

  if (m === "dup") { const c = JSON.parse(JSON.stringify(w)); c.id = uid(); c.name = (w.name || "Scheda") + " (copia)"; c.ex.forEach(z => z.id = uid()); S.w.splice(k + 1, 0, c); S.cur = c.id; closeWkMenu(); commit(); return toast(`Creata «${c.name}»`); }
  if (m === "del") {
    snap(); S.w.splice(k, 1);
    if (!S.w.length) S.w.push({ id: uid(), name: "Nuova scheda", desc: "", ex: [] });
    if (!S.w.some(z => z.id === S.cur)) S.cur = S.w[Math.max(0, k - 1)].id;
    closeWkMenu(); commit(); return toast(`Scheda «${w.name || "Senza nome"}» eliminata`, true);
  }
});
$("gg").onclick = () => { S.view = "imp"; commit(); window.scrollTo({ top: 0 }); };


// ---- scelta esercizio ----
let pickIdx = -1, grp = 0, eqf = -1;
let pickSec = null;
function openPick(i, sec) { pickIdx = i; pickSec = sec || null; grp = sec ? 2 : 0; eqf = -1; $("q").value = ""; drawPick(); $("dlg").classList.add("open"); $("q").focus(); }
const closePick = () => $("dlg").classList.remove("open");
function mine() {
  const ids = new Set(), cus = new Set();
  S.w.forEach(w => w.ex.forEach(x => x.c === null ? cus.add(x.n) : ids.add(x.c + ":" + x.e)));
  S.log.forEach(l => l.ex.forEach(x => x.c === null ? cus.add(x.n) : ids.add(x.c + ":" + x.e)));
  return { ids, cus: [...cus] };
}
function drawPick() {
  const q = norm($("q").value.trim()), toks = q.split(/\s+/).filter(Boolean);
  $("chips").innerHTML = GROUPS.map((g, k) => `<button class="${k === grp ? "on" : ""}" data-g="${k}">${g[0]}</button>`).join("");
  $("eqs").innerHTML = [`<button class="${eqf < 0 ? "on" : ""}" data-q="-1">Qualsiasi attrezzo</button>`, ...EQG.map((g, k) => `<button class="${eqf === k ? "on" : ""}" data-q="${k}">${g}</button>`)].join("");
  const gm = GROUPS[grp][1], my = gm === -1 ? mine() : null;
  const hit = x => toks.every(t => x.k.includes(t) || (GL[t] && x.k.includes(GL[t])));
  let res = CAT.filter(x => (gm === 0 || (gm === -1 ? my.ids.has(x.c + ":" + x.e) : gm === -2 ? x.cat.k === "warmUp" : x.p & gm)) && (eqf < 0 || x.q & B(eqf)) && hit(x));
  const score = x => (STBY.has(x.c + ":" + x.e) ? 3 : 0) + (x.it ? 4 : 0) + (q && x.k.includes(q) ? 6 : 0) + (x.k.startsWith(q) ? 3 : 0) - (/^weighted/i.test(x.en) ? 2 : 0) - x.n.length / 100;
  res.sort((a, b) => score(b) - score(a));
  const total = res.length; res = res.slice(0, 80);
  const cus = my ? my.cus.filter(n => toks.every(t => norm(n).includes(t))) : [];
  const exact = CAT.some(x => norm(x.n) === q);
  const own = q && !exact ? `<button class="custom" data-c="${esc($("q").value.trim())}">Usa «${esc($("q").value.trim())}» come esercizio personalizzato<span>nuovo</span></button>` : "";
  $("lst").innerHTML = (total || cus.length ? "" : own)
    + cus.map(n => `<button data-c="${esc(n)}">${esc(n)}<span>personalizzato</span></button>`).join("")
    + res.map(x => `<button data-id="${x.c}:${x.e}">${STBY.has(x.c + ":" + x.e) ? anim(STBY.get(x.c + ":" + x.e), "th") : ""}<div class="ln">${esc(x.n)}${x.it ? `<small>${esc(x.en)}</small>` : ""}</div><span>${esc(x.cat.it)}</span></button>`).join("")
    + (total > 80 ? `<p class="more">Altri ${fmtN(total - 80)} esercizi: scrivi qualcosa per restringere la ricerca</p>` : "")
    + (total || cus.length ? own : "")
    + (!total && !cus.length ? `<p class="more">Nessun esercizio trovato${grp || eqf >= 0 ? " con questi filtri" : ""}</p>` : "");
  $("cnt").textContent = `${fmtN(total)} esercizi`;
}
function choose(id, custom) {
  const w = W(), c = custom ? null : BYID.get(id), n = custom ? id : c.n;
  if (pickSec) { const z = c && STBY.get(id); (w[pickSec] = w[pickSec] || []).push({ id: uid(), n, c: c ? c.c : null, e: c ? c.e : null, sec: 30, side: z ? !!z.side : false }); closePick(); return commit(); }
  const timed = c && (c.cat.k === "plank" || c.cat.k === "warmUp" || /hold|plank|wall sit|static/i.test(c.en));
  if (pickIdx < 0) {
    const x = { id: uid(), n, c: c ? c.c : null, e: c ? c.e : null, mode: timed ? "time" : "reps", same: true, sets: Array.from({ length: 3 }, () => ({ v: timed ? 30 : 10, kg: 0 })), rest: S.cfg.rest, restAfter: S.cfg.restAfter };
    w.ex.push(x);
  } else { Object.assign(w.ex[pickIdx], { n, c: c ? c.c : null, e: c ? c.e : null }); }
  closePick(); commit();
  if (pickIdx < 0) window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}
$("q").addEventListener("input", drawPick);
$("q").addEventListener("keydown", e => { if (e.key === "Enter") { const f = $("lst").querySelector("button"); if (f) f.click(); } });
$("chips").addEventListener("click", e => { const b = e.target.closest("[data-g]"); if (b) { grp = +b.dataset.g; drawPick(); $("q").focus(); } });
$("eqs").addEventListener("click", e => { const b = e.target.closest("[data-q]"); if (b) { eqf = +b.dataset.q; drawPick(); $("q").focus(); } });
$("lst").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; b.dataset.c ? choose(b.dataset.c, true) : choose(b.dataset.id, false); });
$("dlg").addEventListener("click", e => { if (e.target.id === "dlg") closePick(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closePick(); closeWkMenu(); } });

// ---- file ----
function download(name, data, type) {
  const url = URL.createObjectURL(new Blob([data], { type }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const fileName = s => (s || "Scheda").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 40) || "Scheda";

// Costruisce il file FIT "workout" (forza) per l'orologio
function buildFit(w) {
  const { Encoder, Profile } = window.FitSDK, M = Profile.MesgNum;
  const UNKNOWN = 65534, customIdx = new Map(), titles = new Map(), steps = [], ex = w.ex;
  const push = s => steps.push({ messageIndex: steps.length, targetType: "open", ...s });
  const codes = x => { let cat = x.c, en = x.e; if (cat === null || cat === undefined) { if (!customIdx.has(x.n)) customIdx.set(x.n, customIdx.size); cat = UNKNOWN; en = customIdx.get(x.n); } titles.set(cat + ":" + en, { exerciseCategory: cat, exerciseName: en, wktStepName: x.n.slice(0, 50) }); return [cat, en]; };
  const work = (x, s) => { const [cat, en] = codes(x); push({ wktStepName: x.n.slice(0, 50), durationType: x.mode === "reps" ? "reps" : "time", durationValue: x.mode === "reps" ? s.v : s.v * 1000, intensity: "active", exerciseCategory: cat, exerciseName: en, ...(s.kg > 0 ? { exerciseWeight: s.kg, weightDisplayUnit: "kilogram" } : {}) }); };
  const rest = sec => { if (sec > 0) push({ wktStepName: "Recupero", durationType: "time", durationValue: sec * 1000, intensity: "rest" }); };
  const repeat = (first, times) => push({ durationType: "repeatUntilStepsCmplt", durationValue: first, targetValue: times });
  const stretchStep = (x, intensity) => { const [cat, en] = codes(x); push({ wktStepName: x.n.slice(0, 50), durationType: "time", durationValue: x.sec * (x.side ? 2 : 1) * 1000, intensity, exerciseCategory: cat, exerciseName: en }); };
  (w.warm || []).forEach(x => stretchStep(x, "warmup"));
  const groups = groupsOf(ex);
  groups.forEach((g, gi) => {
    const lastG = gi === groups.length - 1;
    if (g.length === 1) {
      const x = ex[g[0]], n = x.sets.length, ra = lastG ? 0 : (x.restAfter ?? x.rest);
      if (x.same && n > 2) { const first = steps.length; work(x, x.sets[0]); rest(x.rest); repeat(first, n - 1); work(x, x.sets[n - 1]); rest(ra); }
      else x.sets.forEach((s, j) => { work(x, s); rest(j < n - 1 ? x.rest : ra); });
      return;
    }
    const R = Math.max(...g.map(i => ex[i].sets.length)), L = ex[g[g.length - 1]], ra = lastG ? 0 : (L.restAfter ?? L.rest);
    const same = g.every(i => ex[i].same && ex[i].sets.length === R);
    const round = (r, endRest) => g.forEach((i, m) => { const x = ex[i]; if (r >= x.sets.length) return; work(x, x.sets[r]); rest(m === g.length - 1 ? endRest : (x.restAfter || 0)); });
    if (same && R > 2) { const first = steps.length; round(0, L.rest); repeat(first, R - 1); round(R - 1, ra); }
    else for (let r = 0; r < R; r++) round(r, r < R - 1 ? L.rest : ra);
  });
  (w.cool || []).forEach(x => stretchStep(x, "cooldown"));
  const enc = new Encoder();
  enc.onMesg(M.FILE_ID, { type: "workout", manufacturer: "development", product: 0, serialNumber: Math.floor(Math.random() * 1e9), timeCreated: new Date() });
  enc.onMesg(M.WORKOUT, { wktName: (w.name || "Scheda").slice(0, 40), sport: "training", subSport: "strengthTraining", numValidSteps: steps.length, ...(w.desc ? { wktDescription: w.desc.slice(0, 120) } : {}) });
  steps.forEach(s => enc.onMesg(M.WORKOUT_STEP, s));
  [...titles.values()].forEach((t, i) => enc.onMesg(M.EXERCISE_TITLE, { messageIndex: i, ...t }));
  return enc.close();
}
window.buildFit = buildFit;
function exportFit() {
  const w = W(); if (!w.ex.length) return;
  try { download(`ANT_${fileName(w.name)}.fit`, buildFit(w), "application/octet-stream"); toast("File .fit scaricato: copialo in GARMIN › NewFiles"); }
  catch (err) { console.error(err); toast("Errore nella creazione del file: " + err.message); }
}
$("lv").onclick = () => { if (S.live) { S.view = "live"; commit(); window.scrollTo({ top: 0 }); } else startLive(); };
$("lg").onclick = () => startLog();
function backup() { download(`ANT_backup_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: "ant-schede", v: 3, w: S.w, log: S.log, cfg: S.cfg }, null, 1), "application/json"); toast("Backup scaricato"); }
$("imf").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text()); if (!Array.isArray(d.w)) throw new Error("formato non valido");
    snap(); const ids = new Set(S.w.map(w => w.id));
    d.w.forEach(w => { if (ids.has(w.id)) w.id = uid(); w.ex.forEach(x => { if (x.restAfter === undefined) x.restAfter = x.rest; }); S.w.push(w); });
    const lids = new Set(S.log.map(z => z.id)); let nl = 0;
    (Array.isArray(d.log) ? d.log : []).forEach(z => { if (!lids.has(z.id)) { S.log.push(z); nl++; } });
    S.cur = d.w[0]?.id || S.cur; commit(); toast(`${d.w.length} schede${nl ? " e " + nl + " allenamenti" : ""} importati`, true);
  } catch (err) { toast("File non valido: " + err.message); }
};
// ---- app installabile e aggiornamenti ----
const APP_VERSION = "__VERSION__";
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
let deferredInstall = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; $("inst").hidden = false; });
$("inst").onclick = async () => { if (!deferredInstall) return; deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) {} deferredInstall = null; $("inst").hidden = true; };
window.addEventListener("appinstalled", () => { $("inst").hidden = true; toast("App installata: la trovi tra le tue app"); });
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  let waiting = null, reloading = false;
  const offer = w => { waiting = w; $("upd").classList.add("show"); };
  let asked = false;
  $("updb").onclick = () => { asked = true; if (waiting) waiting.postMessage("skip"); $("upd").classList.remove("show"); };
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!asked || reloading) return; reloading = true; location.reload(); });
  navigator.serviceWorker.register("sw.js").then(reg => {
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener("updatefound", () => { const n = reg.installing; if (n) n.addEventListener("statechange", () => { if (n.state === "installed" && navigator.serviceWorker.controller) offer(n); }); });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && navigator.onLine) reg.update().catch(() => {}); });
  }).catch(() => {});
}
render();
}
